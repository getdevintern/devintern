[test]
# Preloaded before every test. Two guards:
#
# guard-git-state.ts bans process.chdir so tests cannot leave the process
# inside a scratch git repo (which caused junk branches to be pushed to the
# real remote).
#
# guard-queue-db.ts pins WEBHOOK_QUEUE_DB to a unique temp database and fails
# the run if any real .devintern-code/queue.db is mutated, so tests can never
# write into a developer's live state database.
#
# guard-workspace-dir.ts pins DEVINTERN_WORKSPACE_DIR to a unique temp directory
# so default resolution of the workspace home (~/.devintern) can never write
# there either — harness run transcripts, repos mirror, worktrees, locks, and
# auth state all resolve through it.
#
# guard-sentry.ts pins SENTRY_DISABLED=1 so test code and CLI subprocesses it
# spawns never report events to the baked-in production Sentry DSN (expected
# user-input validation errors from test scenarios were being shipped to
# Sentry from CI, see DEVINTERN-7).
#
# guard-worker-env.ts drops worker-injected runtime variables
# (DEVINTERN_WORKER_SUBPROCESS, the pipeline override, the harness chain, …) so
# `bun test` behaves the same whether it is run from a shell or from inside a
# DevIntern worker task subprocess.
preload = [
  "./tests/setup/guard-git-state.ts",
  "./tests/setup/guard-queue-db.ts",
  "./tests/setup/guard-workspace-dir.ts",
  "./tests/setup/guard-sentry.ts",
  "./tests/setup/guard-worker-env.ts",
]
