name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Keep in sync with the Bun used locally to generate bun.lock;
          # an older pinned version rejects newer lockfiles under --frozen-lockfile.
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build workspace graph
        run: bun run build

      # The offline e2e suite runs in its own job (e2e-local) so its worker
      # spin-ups do not hold back unit-test feedback.
      - name: Test
        run: bun run turbo run test --filter='!@devintern/e2e' && bun run test:examples
        env:
          # CLI argument tests resolve the configured harness but fail before invoking it.
          AGENT_CLI_PATH: bun

  e2e-local:
    runs-on: ubuntu-latest
    env:
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Keep in sync with the verify job.
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Offline fakes only (local git remotes, fake trackers, stub agent); no
      # credentials. turbo builds packages/code/dist first (e2e#test depends on
      # code#build), so the built-CLI tests run instead of skipping.
      - name: Local e2e suite
        run: bun run turbo run test --filter=@devintern/e2e
        env:
          AGENT_CLI_PATH: bun
